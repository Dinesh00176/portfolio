<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062e26" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3)" rx="16" />
  
  <!-- Outer border -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" rx="12" opacity="0.85" />
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="6,6" rx="8" />

  <!-- Corner ornaments -->
  <circle cx="30" cy="30" r="6" fill="#34d399" />
  <circle cx="770" cy="30" r="6" fill="#34d399" />
  <circle cx="30" cy="470" r="6" fill="#34d399" />
  <circle cx="770" cy="470" r="6" fill="#34d399" />

  <!-- Issuer Header -->
  <text x="400" y="80" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4">INFOSYS SPRINGBOARD</text>
  <text x="400" y="115" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CERTIFICATE OF RECOGNITION</text>
  
  <line x1="280" y1="135" x2="520" y2="135" stroke="url(#emeraldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Awarded to -->
  <text x="400" y="175" text-anchor="middle" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13">This credential confirms that</text>
  <text x="400" y="220" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">M. Dinesh Kumar</text>
  <text x="400" y="250" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13">has accomplished foundational competence in</text>

  <!-- Title -->
  <rect x="100" y="275" width="600" height="60" rx="10" fill="#065f46" stroke="#059669" stroke-width="1" />
  <text x="400" y="312" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Introduction to Data Science</text>

  <!-- Details / Footer -->
  <text x="120" y="415" fill="#6ee7b7" font-family="monospace" font-size="11">ISSUED: 2025</text>
  <text x="120" y="435" fill="#6ee7b7" font-family="monospace" font-size="11">TRACK: DATA SCIENCE &amp; ANALYTICS</text>

  <!-- Gold Seal -->
  <g transform="translate(670, 400)">
    <circle cx="0" cy="0" r="38" fill="url(#gold3)" opacity="0.95" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="3,3" />
    <text x="0" y="-8" text-anchor="middle" fill="#78350f" font-family="system-ui" font-size="9" font-weight="900" letter-spacing="1">DATA</text>
    <text x="0" y="6" text-anchor="middle" fill="#78350f" font-family="system-ui" font-size="11" font-weight="900">2025</text>
    <text x="0" y="18" text-anchor="middle" fill="#78350f" font-family="system-ui" font-size="8" font-weight="700">VERIFIED</text>
  </g>
</svg>
