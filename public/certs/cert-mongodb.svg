<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c11" />
      <stop offset="50%" stop-color="#00351d" />
      <stop offset="100%" stop-color="#00140c" />
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ed64" />
      <stop offset="50%" stop-color="#00684a" />
      <stop offset="100%" stop-color="#023430" />
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg4)" rx="16" />
  
  <!-- Outer border -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#00ed64" stroke-width="2" rx="12" opacity="0.8" />
  <rect x="30" y="30" width="740" height="440" fill="none" stroke="#025430" stroke-width="1" stroke-dasharray="6,6" rx="8" />

  <!-- Corner ornaments -->
  <circle cx="30" cy="30" r="6" fill="#00ed64" />
  <circle cx="770" cy="30" r="6" fill="#00ed64" />
  <circle cx="30" cy="470" r="6" fill="#00ed64" />
  <circle cx="770" cy="470" r="6" fill="#00ed64" />

  <!-- Issuer Header -->
  <text x="400" y="80" text-anchor="middle" fill="#00ed64" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4">MONGODB UNIVERSITY</text>
  <text x="400" y="115" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="2">CERTIFICATE OF PROOF</text>
  
  <line x1="280" y1="135" x2="520" y2="135" stroke="#00ed64" stroke-width="2" stroke-linecap="round" />

  <!-- Awarded to -->
  <text x="400" y="175" text-anchor="middle" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13">Presented to verify completion for</text>
  <text x="400" y="220" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">M. Dinesh Kumar</text>
  <text x="400" y="250" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="13">for demonstrated skills and knowledge in</text>

  <!-- Title -->
  <rect x="100" y="275" width="600" height="60" rx="10" fill="#00351d" stroke="#00ed64" stroke-width="1" />
  <text x="400" y="312" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">MongoDB Atlas</text>

  <!-- Details / Footer -->
  <text x="120" y="415" fill="#a7f3d0" font-family="monospace" font-size="11">ACCREDITED: 2025</text>
  <text x="120" y="435" fill="#a7f3d0" font-family="monospace" font-size="11">PLATFORM: MONGODB ATLAS CLOUD</text>

  <!-- Gold Seal -->
  <g transform="translate(670, 400)">
    <circle cx="0" cy="0" r="38" fill="url(#gold4)" opacity="0.95" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="3,3" />
    <text x="0" y="-8" text-anchor="middle" fill="#78350f" font-family="system-ui" font-size="9" font-weight="900" letter-spacing="1">MONGO</text>
    <text x="0" y="6" text-anchor="middle" fill="#78350f" font-family="system-ui" font-size="11" font-weight="900">2025</text>
    <text x="0" y="18" text-anchor="middle" fill="#78350f" font-family="system-ui" font-size="8" font-weight="700">ATLAS</text>
  </g>
</svg>
